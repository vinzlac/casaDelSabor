# Image : la CI pousse :latest, :<sha> et :main (voir .github/workflows/build-push.yml). Pas de tag implicite « branche » sans workflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casadelsabor
  namespace: casadelsabor
  labels:
    app.kubernetes.io/name: casadelsabor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casadelsabor
  template:
    metadata:
      labels:
        app: casadelsabor
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: agent
          image: ghcr.io/vinzlac/casadelsabor:956b5838a4da471a64e55791fef65981daf59bd8
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          # ConfigMap : QDRANT_URL, LLM_MODEL, etc. Trois Secrets (SealedSecrets) :
          # casadelsabor-llm → LLM_API_KEY ; casadelsabor-qdrant → QDRANT_API_KEY ; casadelsabor-api → API_KEY.
          env:
            - name: PORT
              value: "8000"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: casadelsabor-llm
                  key: LLM_API_KEY
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: casadelsabor-qdrant
                  key: QDRANT_API_KEY
                  optional: true
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: casadelsabor-api
                  key: API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: casadelsabor-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
