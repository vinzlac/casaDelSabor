apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casadelsabor
  namespace: casadelsabor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: casadelsabor.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casadelsabor
                port:
                  number: 8000
