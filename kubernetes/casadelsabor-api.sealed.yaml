# Uniquement API_KEY (auth /ingest, /status). LLM et Qdrant : casadelsabor-llm / casadelsabor-qdrant.
# kubeseal : kubectl create secret generic casadelsabor-api --dry-run=client -n casadelsabor \
#   --from-literal=API_KEY=... -o yaml | kubeseal -o yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: casadelsabor-api
  namespace: casadelsabor
spec:
  encryptedData:
    API_KEY: 
  template:
    metadata:
      name: casadelsabor-api
      namespace: casadelsabor
