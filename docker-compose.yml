services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: casa-del-sabor-qdrant
    ports:
      - "6333:6333"  # API REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    # Healthcheck désactivé car curl n'est pas disponible dans l'image Qdrant
    # Le service fonctionne parfaitement bien sans

volumes:
  qdrant_storage:
    driver: local
