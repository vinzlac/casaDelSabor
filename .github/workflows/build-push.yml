# Phase B — image GHCR pour k3s / Argo CD.
# Variante « ubuntu + buildx » : fonctionne sans runner homelab.
# Pour le template officiel (BuildKit in-cluster + ARC), fusionner avec
# templates/external-app-repo/ du repo k3s-homelab (runs-on: arc-runner-…, secret BUILDKIT_HOST).
name: Build and push agent image

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - "web-alt/**"
      - "mobile/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase for GHCR)
        run: echo "IMAGE_L=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_L }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_L }}:${{ github.sha }}
